<html manifest="psfree_lapse.cache">
  <head>
    <meta charset="utf-8">
    <title>PS4 FW7-9系统一键折腾</title>
    <style>
        body {
        background-color: #0A0A2A;
        color:  white;
		font-size:24px;
        font-family: "Segoe UI", Tahoma, sans-serif;
        text-align: center;
      }
      h1 {
        margin-bottom: 20px;
      }
      #console {
        font-family: monospace;
        background-color: black;
        color: #cccccc;
        border: 1px solid #3c3c3c;
        padding: 12px;
        border-radius: 6px;
        margin-top: 20px;
        text-align: left;
      }
      #jailbreakBtn {
        margin-top: 20px;
        padding: 12px 24px;
        font-size: 30px;
        font-weight: bold;
        background: red;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      #jailbreakBtn:disabled {
        background: #555555;
        color: #aaaaaa;
        cursor: not-allowed;
      }
      #jailbreakBtn:not(:disabled):hover {
        background: green;
      }
      footer {
        margin-top: 30px;
        font-size: 14px;
        color: #888;
      }
	  
    </style>
  </head>
 <body><br>
    <h1>PS4 FW7-9系统一键折腾V2</h1>
	    <h2>（PSfree+lapse）</h2>
    <div><br><br>
      <button id="jailbreakBtn" style='font-size:30px;text-align:center;color:white;text-shadow: 4px 4px 4px black;'>开 始 折 腾</button>
    </div>
    <pre id="console"></pre>
    <footer>
       <strong>制作日期2025.12.04</strong>
    </footer>
  </body>
  <script>
    // Clear history and prevent back navigation
    history.replaceState(null, null, 'index.html');
    var histlength = history.length;
    history.go(-histlength);
    // Logging utility
    const outputConsole = document.getElementById("console");
    window.log = (msg) => { outputConsole.textContent += msg + "\n"; };
    // Download progress (% display)
    function DLProgress(e) {
      const percent = (Math.round((e.loaded / e.total) * 100));
      window.log(`[CACHE] Downloading... ${percent}% complete.`);
    }
    // On cache complete
    function DisplayCacheProgress() {
      window.log(" ");
      window.log("网页缓存完成.");
      window.log("网页刷新中...");
      // Delay to show success message before navigation
      setTimeout(function() { window.log("Reloading..."); }, 2000);
      // Navigate back to index.html to load the exploit from cache
      setTimeout(function() { location.reload(); }, 3000);
    }
    // Event listeners
    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
    window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
    // Initialization message on DOM load
    document.addEventListener('DOMContentLoaded', () => {
      outputConsole.textContent = ""; // Clear console log
      window.log("网页缓存下载中...");
      window.log("请等待...");
    });
  </script>
</html>
